# ================================================================
# application.properties – SkillSwap Spring Boot Configuration
# ================================================================
# IMPORTANT: Never commit real passwords to version control.
# Copy this file to application.properties and fill in your values.
# ================================================================

# ----- Server -----
server.port=${PORT:8080}

# ----- Application Name -----
spring.application.name=skillswap

# ----- MySQL DataSource -----
# Supports environment variables in cloud deployments with local fallbacks
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/skillswap_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:your_mysql_password_here}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----- JPA / Hibernate -----
# create-drop  : drops and recreates schema on each restart (use during early dev)
# update       : only adds missing columns / tables (use once schema is stable)
# validate     : just checks schema matches entities (use in production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ----- Jackson (JSON serializer) -----
# Ignore null fields in JSON responses (cleaner API responses)
spring.jackson.default-property-inclusion=non_null
# Format dates as ISO-8601 strings, not timestamps
spring.jackson.serialization.write-dates-as-timestamps=false

# ----- Session -----
# Spring Security session timeout
server.servlet.session.timeout=3600s

# ----- Logging -----
logging.level.com.skillswap=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
