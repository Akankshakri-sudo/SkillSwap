<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile – SkillSwap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="ss-navbar navbar navbar-expand-lg">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="/index.html"><i class="fa-solid fa-rotate me-1"></i>SkillSwap</a>
        <div class="d-flex align-items-center gap-3 ms-auto">
            <a href="/dashboard.html" class="nav-link"><i class="fas fa-home me-1"></i>Dashboard</a>
            <a href="/discover.html" class="nav-link"><i class="fas fa-search me-1"></i>Discover</a>
            <button class="btn-danger-ss" onclick="logout()" style="font-size:0.82rem;padding:0.35rem 0.9rem;">
                <i class="fas fa-sign-out-alt me-1"></i>Logout
            </button>
        </div>
    </div>
</nav>

<div class="container py-4" style="max-width:860px;">

    <!-- Profile Header -->
    <div class="ss-card mb-4">
        <div class="d-flex flex-wrap gap-4 align-items-start">
            <!-- Avatar -->
            <div>
                <div class="student-avatar" id="avatarEl" style="width:80px;height:80px;font-size:2rem;">?</div>
            </div>
            <!-- Info -->
            <div class="flex-grow-1">
                <h3 id="profileName" class="fw-800 mb-1">Loading...</h3>
                <div class="text-muted small" id="profileMeta"></div>
                <div class="mt-2" id="profileBio"></div>
                <div class="mt-2 d-flex flex-wrap gap-2">
                    <span id="modeTag"></span>
                    <span id="mentoringTag"></span>
                </div>
            </div>
            <!-- Edit Button -->
            <button class="btn-secondary-ss" data-bs-toggle="modal" data-bs-target="#editModal">
                <i class="fas fa-edit"></i> Edit Profile
            </button>
        </div>
    </div>

    <!-- Skills Section -->
    <div class="row g-4">

        <!-- Can Teach -->
        <div class="col-md-6">
            <div class="ss-card h-100">
                <div class="section-title">
                    <i class="fas fa-chalkboard-teacher text-success"></i> Skills I Can Teach
                </div>
                <div id="canTeachList"></div>
                <button class="btn-primary-ss mt-3 w-100 justify-content-center"
                        onclick="openAddSkillModal('CAN_TEACH')">
                    <i class="fas fa-plus"></i> Add Skill to Teach
                </button>
            </div>
        </div>

        <!-- Wants to Learn -->
        <div class="col-md-6">
            <div class="ss-card h-100">
                <div class="section-title">
                    <i class="fas fa-graduation-cap text-primary"></i> Skills I Want to Learn
                </div>
                <div id="wantToLearnList"></div>
                <button class="btn-secondary-ss mt-3 w-100 justify-content-center"
                        onclick="openAddSkillModal('WANTS_TO_LEARN')">
                    <i class="fas fa-plus"></i> Add Skill to Learn
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ============ EDIT PROFILE MODAL ============ -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content border-0 shadow">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-700">Edit Profile</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body px-4">
                <form id="editForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="ss-form-group mb-0">
                                <label>Full Name</label>
                                <input type="text" id="edit_name" name="name" class="ss-input">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="ss-form-group mb-0">
                                <label>College / University</label>
                                <input type="text" id="edit_college" name="college" class="ss-input">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="ss-form-group mb-0">
                                <label>Department</label>
                                <input type="text" id="edit_department" name="department" class="ss-input">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="ss-form-group mb-0">
                                <label>Year of Study</label>
                                <select id="edit_yearOfStudy" name="yearOfStudy" class="ss-input">
                                    <option value="">Select</option>
                                    <option value="1">1st Year</option>
                                    <option value="2">2nd Year</option>
                                    <option value="3">3rd Year</option>
                                    <option value="4">4th Year</option>
                                    <option value="5">5th Year</option>
                                    <option value="6">6th Year</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="ss-form-group mb-0">
                                <label>Preferred Mode</label>
                                <select id="edit_preferredMode" name="preferredMode" class="ss-input">
                                    <option value="">Select</option>
                                    <option value="ONLINE">Online</option>
                                    <option value="IN_PERSON">In-Person</option>
                                    <option value="BOTH">Both</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="ss-form-group mb-0">
                                <label>Short Bio</label>
                                <textarea id="edit_bio" name="bio" class="ss-input" rows="3"
                                    placeholder="Tell others about yourself, your interests, and what you're studying..."></textarea>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="ss-form-group mb-0">
                                <label>Profile Image URL (optional)</label>
                                <input type="url" id="edit_profileImageUrl" name="profileImageUrl" class="ss-input"
                                    placeholder="https://...">
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="edit_offersFreeMentoring" role="switch">
                                <label class="form-check-label fw-600" for="edit_offersFreeMentoring">
                                    🎯 I offer free mentoring sessions
                                </label>
                                <div class="text-muted small">Enable this to let other students request free mentoring from you.</div>
                            </div>
                        </div>
                    </div>
                    <div id="editError" class="alert alert-danger mt-3 d-none"></div>
                </form>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn-secondary-ss" data-bs-dismiss="modal">Cancel</button>
                <button type="button" id="saveProfileBtn" class="btn-primary-ss" onclick="saveProfile()">
                    <i class="fas fa-save"></i> Save Changes
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ============ ADD SKILL MODAL ============ -->
<div class="modal fade" id="addSkillModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content border-0 shadow">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-700" id="addSkillModalTitle">Add Skill</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body px-4">
                <input type="hidden" id="skillTypeInput">
                <div class="ss-form-group">
                    <label>Select a Skill</label>
                    <select id="skillSelect" class="ss-input">
                        <option value="">-- Choose a skill --</option>
                    </select>
                </div>
                <div id="addSkillError" class="alert alert-danger d-none"></div>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn-secondary-ss" data-bs-dismiss="modal">Cancel</button>
                <button type="button" id="addSkillBtn" class="btn-primary-ss" onclick="addSkill()">
                    <i class="fas fa-plus"></i> Add Skill
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
let currentUser = null;
let allSkills = [];

async function init() {
    currentUser = await requireAuth();
    if (!currentUser) return;

    await Promise.all([loadProfile(), loadAllSkills()]);
}

async function loadProfile() {
    try {
        const user = await api.get('/api/users/me');
        renderProfile(user);
        populateEditForm(user);
    } catch (err) {
        showToast('Could not load profile', 'error');
    }
}

function renderProfile(user) {
    // Avatar
    const avatarEl = document.getElementById('avatarEl');
    if (user.profileImageUrl) {
        avatarEl.innerHTML = `<img src="${user.profileImageUrl}" style="width:80px;height:80px;border-radius:50%;object-fit:cover;" onerror="this.style.display='none'">`;
    } else {
        avatarEl.textContent = user.name ? user.name[0].toUpperCase() : '?';
    }

    document.getElementById('profileName').textContent = user.name;
    document.getElementById('profileMeta').innerHTML = [
        user.college ? `🏫 ${user.college}` : '',
        user.department ? `📚 ${user.department}` : '',
        user.yearOfStudy ? `📅 Year ${user.yearOfStudy}` : '',
        `✉️ ${user.email}`
    ].filter(Boolean).join(' &nbsp;·&nbsp; ');

    document.getElementById('profileBio').textContent = user.bio || '';

    document.getElementById('modeTag').innerHTML = user.preferredMode
        ? `<span class="skill-tag skill-tag-learn">${user.preferredMode.replace('_', '-')}</span>` : '';
    document.getElementById('mentoringTag').innerHTML = user.offersFreeMentoring
        ? `<span class="mentoring-badge">🎯 Offers Free Mentoring</span>` : '';

    renderSkillList('canTeachList', user.skillsCanTeach, 'teach');
    renderSkillList('wantToLearnList', user.skillsWantToLearn, 'learn');
}

function renderSkillList(containerId, skills, type) {
    const container = document.getElementById(containerId);
    if (!skills || skills.length === 0) {
        container.innerHTML = `<div class="text-muted small">No skills added yet. Click "Add Skill" below.</div>`;
        return;
    }
    container.innerHTML = skills.map(s => `
        <div class="d-flex align-items-center justify-content-between mb-2">
            <span class="skill-tag skill-tag-${type}">${s.name}</span>
            <button class="btn btn-sm btn-link text-danger p-0 ms-2" onclick="removeSkill(${s.userSkillId})"
                    title="Remove ${s.name}">
                <i class="fas fa-times-circle"></i>
            </button>
        </div>
    `).join('');
}

function populateEditForm(user) {
    document.getElementById('edit_name').value = user.name || '';
    document.getElementById('edit_college').value = user.college || '';
    document.getElementById('edit_department').value = user.department || '';
    document.getElementById('edit_yearOfStudy').value = user.yearOfStudy || '';
    document.getElementById('edit_bio').value = user.bio || '';
    document.getElementById('edit_profileImageUrl').value = user.profileImageUrl || '';
    document.getElementById('edit_preferredMode').value = user.preferredMode || '';
    document.getElementById('edit_offersFreeMentoring').checked = user.offersFreeMentoring || false;
}

async function saveProfile() {
    const btn = document.getElementById('saveProfileBtn');
    const errorDiv = document.getElementById('editError');
    errorDiv.classList.add('d-none');
    setButtonLoading(btn, true);

    const payload = {
        name:                 document.getElementById('edit_name').value.trim() || null,
        college:              document.getElementById('edit_college').value.trim() || null,
        department:           document.getElementById('edit_department').value.trim() || null,
        yearOfStudy:          document.getElementById('edit_yearOfStudy').value ? parseInt(document.getElementById('edit_yearOfStudy').value) : null,
        bio:                  document.getElementById('edit_bio').value.trim() || null,
        profileImageUrl:      document.getElementById('edit_profileImageUrl').value.trim() || null,
        preferredMode:        document.getElementById('edit_preferredMode').value || null,
        offersFreeMentoring:  document.getElementById('edit_offersFreeMentoring').checked
    };

    try {
        const updated = await api.put('/api/users/me', payload);
        showToast('Profile updated successfully! ✅', 'success');
        bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
        renderProfile(updated);
    } catch (err) {
        errorDiv.textContent = err.message || 'Failed to update profile.';
        errorDiv.classList.remove('d-none');
    } finally {
        setButtonLoading(btn, false, 'Save Changes');
    }
}

async function loadAllSkills() {
    try {
        allSkills = await api.get('/api/skills');
        const select = document.getElementById('skillSelect');
        const grouped = {};
        allSkills.forEach(s => {
            if (!grouped[s.category]) grouped[s.category] = [];
            grouped[s.category].push(s);
        });
        select.innerHTML = '<option value="">-- Choose a skill --</option>';
        Object.entries(grouped).forEach(([cat, skills]) => {
            const group = document.createElement('optgroup');
            group.label = cat;
            skills.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.id;
                opt.textContent = s.name;
                group.appendChild(opt);
            });
            select.appendChild(group);
        });
    } catch (err) {
        console.error('Could not load skills:', err);
    }
}

function openAddSkillModal(type) {
    document.getElementById('skillTypeInput').value = type;
    document.getElementById('addSkillModalTitle').textContent =
        type === 'CAN_TEACH' ? '➕ Add Skill I Can Teach' : '➕ Add Skill I Want to Learn';
    document.getElementById('skillSelect').value = '';
    document.getElementById('addSkillError').classList.add('d-none');
    new bootstrap.Modal(document.getElementById('addSkillModal')).show();
}

async function addSkill() {
    const skillId = document.getElementById('skillSelect').value;
    const skillType = document.getElementById('skillTypeInput').value;
    const errorDiv = document.getElementById('addSkillError');
    errorDiv.classList.add('d-none');

    if (!skillId) {
        errorDiv.textContent = 'Please select a skill.';
        errorDiv.classList.remove('d-none');
        return;
    }

    const btn = document.getElementById('addSkillBtn');
    setButtonLoading(btn, true);

    try {
        const updated = await api.post('/api/users/me/skills', {
            skillId: parseInt(skillId),
            skillType
        });
        showToast('Skill added!', 'success');
        bootstrap.Modal.getInstance(document.getElementById('addSkillModal')).hide();
        renderProfile(updated);
    } catch (err) {
        errorDiv.textContent = err.message || 'Could not add skill.';
        errorDiv.classList.remove('d-none');
    } finally {
        setButtonLoading(btn, false, 'Add Skill');
    }
}

async function removeSkill(userSkillId) {
    if (!confirm('Remove this skill?')) return;
    try {
        await api.delete(`/api/users/me/skills/${userSkillId}`);
        showToast('Skill removed.', 'info');
        await loadProfile();
    } catch (err) {
        showToast(err.message || 'Could not remove skill.', 'error');
    }
}

init();
</script>
</body>
</html>
