<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile – SkillSwap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="ss-navbar navbar navbar-expand-lg">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="/index.html"><i class="fa-solid fa-rotate me-1"></i>SkillSwap</a>
        <div class="d-flex align-items-center gap-3 ms-auto">
            <a href="/dashboard.html" class="nav-link"><i class="fas fa-home me-1"></i>Dashboard</a>
            <a href="/discover.html" class="nav-link"><i class="fas fa-search me-1"></i>Discover</a>
            <a href="/requests.html" class="nav-link"><i class="fas fa-envelope me-1"></i>Requests</a>
            <a href="/profile.html" class="nav-link"><i class="fas fa-user me-1"></i>Profile</a>
            <button class="btn-danger-ss" onclick="logout()" style="font-size:0.82rem;padding:0.35rem 0.9rem;">
                <i class="fas fa-sign-out-alt me-1"></i>Logout
            </button>
        </div>
    </div>
</nav>

<div class="container py-4" style="max-width:860px;">
    <!-- Back Link -->
    <div class="mb-3">
        <a href="/discover.html" class="text-decoration-none text-muted small fw-600">
            <i class="fas fa-arrow-left me-1"></i> Back to Discover
        </a>
    </div>

    <!-- Student Profile Card -->
    <div class="ss-card mb-4" id="profileCard">
        <div class="text-center py-5" id="profileLoading">
            <div class="loading-spinner mx-auto mb-3"></div>
            <p class="text-muted">Loading student profile...</p>
        </div>
        <div id="profileContent" class="d-none">
            <div class="d-flex flex-wrap gap-4 align-items-start">
                <div class="student-avatar" id="avatarEl" style="width:84px;height:84px;font-size:2.2rem;">?</div>
                <div class="flex-grow-1">
                    <div class="d-flex align-items-center gap-2 flex-wrap">
                        <h3 id="studentName" class="fw-800 mb-0">Student Name</h3>
                        <span id="mentoringBadgeContainer"></span>
                    </div>
                    <div class="text-muted small mt-1" id="studentMeta"></div>
                    <div class="mt-2 text-secondary" id="studentBio" style="white-space: pre-line;"></div>
                    <div class="mt-3 d-flex flex-wrap gap-2">
                        <span id="modeTag"></span>
                        <span class="badge bg-light text-dark border">
                            <i class="far fa-calendar-alt me-1 text-primary"></i>Member since <span id="joinedDate"></span>
                        </span>
                    </div>
                </div>
                <div id="actionBtnContainer" class="d-flex flex-column gap-2">
                    <button class="btn-primary-ss" id="openRequestModalBtn">
                        <i class="fas fa-paper-plane"></i> Send Request
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Skills Details -->
    <div class="row g-4 d-none" id="skillsSection">
        <!-- Can Teach -->
        <div class="col-md-6">
            <div class="ss-card h-100">
                <div class="section-title">
                    <i class="fas fa-chalkboard-teacher text-success"></i> Skills This Student Teaches
                </div>
                <div id="canTeachList" class="d-flex flex-wrap gap-2"></div>
            </div>
        </div>

        <!-- Wants to Learn -->
        <div class="col-md-6">
            <div class="ss-card h-100">
                <div class="section-title">
                    <i class="fas fa-graduation-cap text-primary"></i> Skills This Student Wants to Learn
                </div>
                <div id="wantToLearnList" class="d-flex flex-wrap gap-2"></div>
            </div>
        </div>
    </div>
</div>

<!-- ============ SEND REQUEST MODAL ============ -->
<div class="modal fade" id="requestModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content border-0 shadow">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-700">Send Learning Request</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body px-4">
                <div class="d-flex align-items-center gap-3 mb-4 p-3 rounded-3" style="background:#f8faff;">
                    <div class="student-avatar" id="modalAvatar" style="width:48px;height:48px;font-size:1.25rem;"></div>
                    <div>
                        <div class="fw-700" id="modalTargetName"></div>
                        <div class="text-muted small" id="modalTargetCollege"></div>
                    </div>
                </div>

                <!-- Request Type -->
                <div class="ss-form-group">
                    <label class="fw-600">Request Type</label>
                    <div class="d-flex gap-3">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="modalRequestType" id="typeExchange" value="EXCHANGE" checked onchange="toggleSkillTeach()">
                            <label class="form-check-label fw-500" for="typeExchange">🔄 Skill Exchange</label>
                        </div>
                        <div class="form-check" id="mentoringRadioContainer">
                            <input class="form-check-input" type="radio" name="modalRequestType" id="typeMentoring" value="FREE_MENTORING" onchange="toggleSkillTeach()">
                            <label class="form-check-label fw-500" for="typeMentoring">🎯 Free Mentoring</label>
                        </div>
                    </div>
                    <small id="mentoringNotice" class="text-muted d-none">Student has free mentoring enabled.</small>
                </div>

                <!-- Skill to Learn -->
                <div class="ss-form-group">
                    <label class="fw-600">Skill I Want to Learn <span class="text-danger">*</span></label>
                    <select id="modalSkillToLearn" class="ss-input">
                        <option value="">-- Select skill to learn --</option>
                    </select>
                </div>

                <!-- Skill to Teach (Exchange only) -->
                <div class="ss-form-group" id="skillToTeachGroup">
                    <label class="fw-600">Skill I Can Teach in Return <span class="text-danger">*</span></label>
                    <select id="modalSkillToTeach" class="ss-input">
                        <option value="">-- Select skill to offer --</option>
                    </select>
                    <div class="text-muted small mt-1">Select from skills listed on your profile.</div>
                </div>

                <!-- Message -->
                <div class="ss-form-group">
                    <label class="fw-600">Message / Goal <span class="text-muted fw-400">(optional)</span></label>
                    <textarea id="modalRequestMessage" class="ss-input" rows="3"
                        placeholder="Explain what you hope to learn or work on together..."></textarea>
                </div>

                <div id="modalRequestError" class="alert alert-danger d-none"></div>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn-secondary-ss" data-bs-dismiss="modal">Cancel</button>
                <button type="button" id="modalSendBtn" class="btn-primary-ss" onclick="submitRequest()">
                    <i class="fas fa-paper-plane"></i> Send Request
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
let currentUser = null;
let currentProfile = null;
let myProfile = null;
let allSkills = [];

async function init() {
    currentUser = await requireAuth();
    if (!currentUser) return;

    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('id');

    if (!userId) {
        showToast('No student ID provided.', 'warning');
        window.location.href = '/discover.html';
        return;
    }

    try {
        [currentProfile, myProfile, allSkills] = await Promise.all([
            api.get(`/api/users/${userId}`),
            api.get('/api/users/me'),
            api.get('/api/skills')
        ]);

        renderStudentProfile(currentProfile);
    } catch (err) {
        document.getElementById('profileLoading').innerHTML = `
            <div class="alert alert-danger mx-auto" style="max-width:500px;">
                ${err.message || 'Failed to load student profile.'}
            </div>
            <a href="/discover.html" class="btn-secondary-ss">Return to Discover</a>
        `;
    }
}

function renderStudentProfile(user) {
    document.getElementById('profileLoading').classList.add('d-none');
    document.getElementById('profileContent').classList.remove('d-none');
    document.getElementById('skillsSection').classList.remove('d-none');

    const initials = user.name ? user.name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() : '?';
    const avatarEl = document.getElementById('avatarEl');
    if (user.profileImageUrl) {
        avatarEl.innerHTML = `<img src="${user.profileImageUrl}" style="width:84px;height:84px;border-radius:50%;object-fit:cover;" onerror="this.parentNode.textContent='${initials}'">`;
    } else {
        avatarEl.textContent = initials;
    }

    document.getElementById('studentName').textContent = user.name;
    document.title = `${user.name} – SkillSwap`;

    document.getElementById('studentMeta').innerHTML = [
        user.college ? `🏫 ${user.college}` : 'College not specified',
        user.department ? `📚 ${user.department}` : null,
        user.yearOfStudy ? `📅 Year ${user.yearOfStudy}` : null,
        `✉️ ${user.email}`
    ].filter(Boolean).join(' &nbsp;•&nbsp; ');

    document.getElementById('studentBio').textContent = user.bio || 'This student hasn\'t added a bio yet.';
    document.getElementById('joinedDate').textContent = formatDate(user.createdAt);

    if (user.preferredMode) {
        document.getElementById('modeTag').innerHTML = `<span class="badge bg-indigo text-white">${user.preferredMode.replace('_', ' ')}</span>`;
    }

    if (user.offersFreeMentoring) {
        document.getElementById('mentoringBadgeContainer').innerHTML = `<span class="mentoring-badge"><i class="fas fa-award me-1"></i>Free Mentoring Available</span>`;
    }

    // If viewing own profile, change button to edit profile
    if (currentUser.id === user.id) {
        document.getElementById('actionBtnContainer').innerHTML = `
            <a href="/profile.html" class="btn-secondary-ss">
                <i class="fas fa-edit"></i> Edit My Profile
            </a>
        `;
    } else {
        document.getElementById('openRequestModalBtn').onclick = () => openRequestModal(user);
    }

    // Render Skills
    const teachContainer = document.getElementById('canTeachList');
    if (!user.skillsCanTeach || user.skillsCanTeach.length === 0) {
        teachContainer.innerHTML = `<span class="text-muted small">No skills added yet.</span>`;
    } else {
        teachContainer.innerHTML = user.skillsCanTeach.map(s => skillTag(s, 'teach')).join('');
    }

    const learnContainer = document.getElementById('wantToLearnList');
    if (!user.skillsWantToLearn || user.skillsWantToLearn.length === 0) {
        learnContainer.innerHTML = `<span class="text-muted small">No learning goals listed.</span>`;
    } else {
        learnContainer.innerHTML = user.skillsWantToLearn.map(s => skillTag(s, 'learn')).join('');
    }
}

function openRequestModal(target) {
    const initials = target.name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
    document.getElementById('modalAvatar').textContent = initials;
    document.getElementById('modalTargetName').textContent = target.name;
    document.getElementById('modalTargetCollege').textContent = target.college || 'Student';
    document.getElementById('modalRequestError').classList.add('d-none');
    document.getElementById('modalRequestMessage').value = '';

    // If target offers free mentoring, show or highlight radio
    const mentoringRadio = document.getElementById('typeMentoring');
    const mentoringNotice = document.getElementById('mentoringNotice');
    if (target.offersFreeMentoring) {
        mentoringRadio.disabled = false;
        mentoringNotice.classList.remove('d-none');
    } else {
        mentoringRadio.disabled = true;
        mentoringNotice.classList.remove('d-none');
        mentoringNotice.textContent = "Student has not enabled free mentoring; choose Skill Exchange.";
    }

    // Populate skillToLearn dropdown with target's skillsCanTeach
    const learnSelect = document.getElementById('modalSkillToLearn');
    learnSelect.innerHTML = '<option value="">-- Select skill to learn --</option>';
    if (target.skillsCanTeach && target.skillsCanTeach.length > 0) {
        target.skillsCanTeach.forEach(s => {
            learnSelect.innerHTML += `<option value="${s.skillId}">${s.name} (${s.category || 'General'})</option>`;
        });
    } else {
        allSkills.forEach(s => {
            learnSelect.innerHTML += `<option value="${s.id}">${s.name}</option>`;
        });
    }

    // Populate skillToTeach dropdown with my skillsCanTeach
    const teachSelect = document.getElementById('modalSkillToTeach');
    teachSelect.innerHTML = '<option value="">-- Select skill to offer --</option>';
    if (myProfile.skillsCanTeach && myProfile.skillsCanTeach.length > 0) {
        myProfile.skillsCanTeach.forEach(s => {
            teachSelect.innerHTML += `<option value="${s.skillId}">${s.name}</option>`;
        });
    } else {
        teachSelect.innerHTML += '<option value="" disabled>You have no skills listed to teach! Add skills on your profile first.</option>';
    }

    document.getElementById('typeExchange').checked = true;
    toggleSkillTeach();
    new bootstrap.Modal(document.getElementById('requestModal')).show();
}

function toggleSkillTeach() {
    const isExchange = document.getElementById('typeExchange').checked;
    document.getElementById('skillToTeachGroup').style.display = isExchange ? '' : 'none';
}

async function submitRequest() {
    const errorDiv = document.getElementById('modalRequestError');
    errorDiv.classList.add('d-none');

    const requestType = document.querySelector('input[name="modalRequestType"]:checked').value;
    const skillToLearnId = document.getElementById('modalSkillToLearn').value;
    const skillToTeachId = document.getElementById('modalSkillToTeach').value;
    const message = document.getElementById('modalRequestMessage').value.trim();

    if (!skillToLearnId) {
        errorDiv.textContent = 'Please select a skill you want to learn.';
        errorDiv.classList.remove('d-none');
        return;
    }

    if (requestType === 'EXCHANGE' && !skillToTeachId) {
        errorDiv.textContent = 'Please choose a skill you can teach in return.';
        errorDiv.classList.remove('d-none');
        return;
    }

    const btn = document.getElementById('modalSendBtn');
    setButtonLoading(btn, true);

    const payload = {
        receiverId: currentProfile.id,
        requestType,
        skillToLearnId: parseInt(skillToLearnId),
        skillToTeachId: requestType === 'EXCHANGE' ? parseInt(skillToTeachId) : null,
        message: message || null
    };

    try {
        await api.post('/api/requests', payload);
        showToast('Request sent successfully! 🎉', 'success');
        bootstrap.Modal.getInstance(document.getElementById('requestModal')).hide();
    } catch (err) {
        errorDiv.textContent = err.message || 'Failed to send request.';
        errorDiv.classList.remove('d-none');
    } finally {
        setButtonLoading(btn, false, 'Send Request');
    }
}

init();
</script>
</body>
</html>
