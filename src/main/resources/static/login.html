<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – SkillSwap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="brand"><i class="fa-solid fa-rotate me-2"></i>SkillSwap</div>
            <p class="text-muted mt-1">Welcome back! Log in to your account</p>
        </div>

        <form id="loginForm" novalidate>
            <!-- Email -->
            <div class="ss-form-group">
                <label for="email">Email Address <span class="text-danger">*</span></label>
                <input type="email" id="email" name="email" class="ss-input" placeholder="yourname@college.edu" required>
            </div>

            <!-- Password -->
            <div class="ss-form-group">
                <label for="password">Password <span class="text-danger">*</span></label>
                <div class="position-relative">
                    <input type="password" id="password" name="password" class="ss-input pe-5" placeholder="Enter your password" required>
                    <button type="button" class="btn p-0 position-absolute top-50 translate-middle-y me-3 end-0 border-0 bg-transparent" onclick="togglePassword()">
                        <i class="fas fa-eye text-muted" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <!-- Error message -->
            <div id="loginError" class="alert alert-danger py-2 d-none" role="alert"></div>

            <!-- Submit -->
            <button type="submit" id="loginBtn" class="btn-primary-ss w-100 justify-content-center py-3">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <p class="text-center text-muted mt-3 mb-0" style="font-size:0.9rem;">
            Don't have an account? <a href="/register.html" class="fw-600">Create one free</a>
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
    // If already logged in, redirect to dashboard
    (async () => {
        const user = await getCurrentUser();
        if (user) window.location.href = '/dashboard.html';
    })();

    function togglePassword() {
        const field = document.getElementById('password');
        const icon = document.getElementById('eyeIcon');
        if (field.type === 'password') {
            field.type = 'text';
            icon.className = 'fas fa-eye-slash text-muted';
        } else {
            field.type = 'password';
            icon.className = 'fas fa-eye text-muted';
        }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const btn = document.getElementById('loginBtn');
        const errorDiv = document.getElementById('loginError');
        errorDiv.classList.add('d-none');

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
            errorDiv.textContent = 'Please enter your email and password.';
            errorDiv.classList.remove('d-none');
            return;
        }

        setButtonLoading(btn, true);

        try {
            const user = await api.post('/api/auth/login', { email, password });
            showToast(`Welcome back, ${user.name}! 👋`, 'success');

            // Redirect to saved page or dashboard
            const redirect = sessionStorage.getItem('redirectAfterLogin') || '/dashboard.html';
            sessionStorage.removeItem('redirectAfterLogin');
            setTimeout(() => window.location.href = redirect, 800);
        } catch (err) {
            setButtonLoading(btn, false, 'Sign In');
            errorDiv.textContent = err.message || 'Invalid email or password. Please try again.';
            errorDiv.classList.remove('d-none');
        }
    });
</script>
</body>
</html>
