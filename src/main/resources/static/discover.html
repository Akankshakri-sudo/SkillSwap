<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover Students – SkillSwap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="ss-navbar navbar navbar-expand-lg">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="/index.html"><i class="fa-solid fa-rotate me-1"></i>SkillSwap</a>
        <div class="d-flex align-items-center gap-3 ms-auto">
            <a href="/dashboard.html" class="nav-link"><i class="fas fa-home me-1"></i>Dashboard</a>
            <a href="/profile.html" class="nav-link"><i class="fas fa-user me-1"></i>Profile</a>
            <a href="/requests.html" class="nav-link"><i class="fas fa-envelope me-1"></i>Requests</a>
            <button class="btn-danger-ss" onclick="logout()" style="font-size:0.82rem;padding:0.35rem 0.9rem;">
                <i class="fas fa-sign-out-alt me-1"></i>Logout
            </button>
        </div>
    </div>
</nav>

<div class="container py-4">
    <!-- Page Header -->
    <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-3">
        <div>
            <h4 style="font-weight:800;color:#1e1b4b;margin-bottom:0.25rem;">🔍 Discover Students</h4>
            <p class="text-muted mb-0">Find students to exchange skills with or request free mentoring.</p>
        </div>
    </div>

    <!-- Search & Filter Bar -->
    <div class="ss-card mb-4">
        <div class="row g-3 align-items-end">
            <div class="col-md-5">
                <label class="fw-600 small">Search by Skill</label>
                <div class="position-relative">
                    <i class="fas fa-search position-absolute top-50 translate-middle-y ms-3 text-muted"></i>
                    <input type="text" id="skillSearch" class="ss-input ps-5" placeholder="e.g. Java, Python, SQL...">
                </div>
            </div>
            <div class="col-md-3">
                <label class="fw-600 small">Learning Mode</label>
                <select id="modeFilter" class="ss-input">
                    <option value="">All Modes</option>
                    <option value="ONLINE">Online</option>
                    <option value="IN_PERSON">In-Person</option>
                    <option value="BOTH">Both</option>
                </select>
            </div>
            <div class="col-md-2">
                <button class="btn-primary-ss w-100 justify-content-center" onclick="searchStudents()">
                    <i class="fas fa-search"></i> Search
                </button>
            </div>
            <div class="col-md-2">
                <button class="btn-secondary-ss w-100 justify-content-center" onclick="clearFilters()">
                    <i class="fas fa-times"></i> Clear
                </button>
            </div>
        </div>
    </div>

    <!-- Results Info -->
    <div class="d-flex justify-content-between align-items-center mb-3" id="resultsInfo" style="display:none!important;">
        <span class="text-muted small" id="resultsCount"></span>
    </div>

    <!-- Student Grid -->
    <div class="row g-4" id="studentsGrid">
        <div class="col-12 text-center py-5">
            <div class="loading-spinner mx-auto mb-3"></div>
            <p class="text-muted">Loading students...</p>
        </div>
    </div>

    <!-- Pagination -->
    <div class="d-flex justify-content-center mt-4" id="paginationContainer"></div>
</div>

<!-- ============ SEND REQUEST MODAL ============ -->
<div class="modal fade" id="requestModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content border-0 shadow">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-700">Send Request</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body px-4">
                <!-- Receiver info -->
                <div class="d-flex align-items-center gap-3 mb-4 p-3 rounded-3" style="background:#f8faff;">
                    <div class="student-avatar" id="modalAvatar" style="width:48px;height:48px;font-size:1.25rem;"></div>
                    <div>
                        <div class="fw-700" id="modalName"></div>
                        <div class="text-muted small" id="modalCollege"></div>
                    </div>
                </div>

                <!-- Request Type -->
                <div class="ss-form-group">
                    <label class="fw-600">Request Type</label>
                    <div class="d-flex gap-3">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="requestType" id="typeExchange" value="EXCHANGE" checked onchange="toggleSkillTeach()">
                            <label class="form-check-label fw-500" for="typeExchange">🔄 Skill Exchange</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="requestType" id="typeMentoring" value="FREE_MENTORING" onchange="toggleSkillTeach()">
                            <label class="form-check-label fw-500" for="typeMentoring">🎯 Free Mentoring</label>
                        </div>
                    </div>
                </div>

                <!-- Skill to Learn -->
                <div class="ss-form-group">
                    <label class="fw-600">Skill I Want to Learn <span class="text-danger">*</span></label>
                    <select id="skillToLearn" class="ss-input">
                        <option value="">-- Select skill to learn --</option>
                    </select>
                </div>

                <!-- Skill to Teach (Exchange only) -->
                <div class="ss-form-group" id="skillToTeachGroup">
                    <label class="fw-600">Skill I Can Teach in Return <span class="text-danger">*</span></label>
                    <select id="skillToTeach" class="ss-input">
                        <option value="">-- Select skill to offer --</option>
                    </select>
                </div>

                <!-- Message -->
                <div class="ss-form-group">
                    <label class="fw-600">Message <span class="text-muted fw-400">(optional)</span></label>
                    <textarea id="requestMessage" class="ss-input" rows="3"
                        placeholder="Hi! I'd love to exchange skills with you. I can help you with..."></textarea>
                </div>

                <div id="requestError" class="alert alert-danger d-none"></div>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn-secondary-ss" data-bs-dismiss="modal">Cancel</button>
                <button type="button" id="sendRequestBtn" class="btn-primary-ss" onclick="sendRequest()">
                    <i class="fas fa-paper-plane"></i> Send Request
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
let currentUser = null;
let allSkills = [];
let selectedReceiver = null;
let currentPage = 0;
const PAGE_SIZE = 12;

async function init() {
    currentUser = await requireAuth();
    if (!currentUser) return;
    await loadAllSkills();
    await searchStudents();

    // Enter key triggers search
    document.getElementById('skillSearch').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') searchStudents();
    });
}

async function loadAllSkills() {
    allSkills = await api.get('/api/skills');
}

async function searchStudents(page = 0) {
    currentPage = page;
    const skill = document.getElementById('skillSearch').value.trim();
    const mode = document.getElementById('modeFilter').value;

    let url = `/api/users/discover?page=${page}&size=${PAGE_SIZE}`;
    if (skill) url += `&skill=${encodeURIComponent(skill)}`;
    if (mode) url += `&mode=${encodeURIComponent(mode)}`;

    document.getElementById('studentsGrid').innerHTML = `
        <div class="col-12 text-center py-5">
            <div class="loading-spinner mx-auto mb-3"></div>
            <p class="text-muted">Searching students...</p>
        </div>`;

    try {
        const result = await api.get(url);
        renderStudents(result);
    } catch (err) {
        document.getElementById('studentsGrid').innerHTML =
            `<div class="col-12"><div class="alert alert-danger">${err.message}</div></div>`;
    }
}

function renderStudents(pageResult) {
    const { content, totalElements, totalPages, number } = pageResult;
    document.getElementById('resultsInfo').style.display = '';
    document.getElementById('resultsCount').textContent =
        `Found ${totalElements} student${totalElements !== 1 ? 's' : ''}`;

    const grid = document.getElementById('studentsGrid');
    if (!content || content.length === 0) {
        grid.innerHTML = `
            <div class="col-12">
                <div class="empty-state py-5">
                    <div class="empty-icon">🔍</div>
                    <h5 class="fw-700">No students found</h5>
                    <p class="text-muted">Try a different skill name or remove the mode filter.</p>
                    <button class="btn-secondary-ss" onclick="clearFilters()">Clear Filters</button>
                </div>
            </div>`;
        document.getElementById('paginationContainer').innerHTML = '';
        return;
    }

    grid.innerHTML = content.map(student => studentCard(student)).join('');
    renderPagination(totalPages, number);
}

function studentCard(student) {
    const initials = student.name ? student.name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() : '?';
    const teachSkills = (student.skillsCanTeach || []).slice(0, 3);
    const learnSkills = (student.skillsWantToLearn || []).slice(0, 3);

    return `
    <div class="col-sm-6 col-lg-4">
        <div class="student-card">
            <div class="d-flex align-items-start gap-3 mb-3">
                <div class="student-avatar" style="width:52px;height:52px;font-size:1.25rem;flex-shrink:0;">
                    ${student.profileImageUrl
                        ? `<img src="${student.profileImageUrl}" style="width:52px;height:52px;border-radius:50%;object-fit:cover;" onerror="this.parentNode.textContent='${initials}'">`
                        : initials}
                </div>
                <div class="flex-grow-1 overflow-hidden">
                    <div class="fw-700 text-truncate">${student.name}</div>
                    <div class="text-muted small text-truncate">${student.college || 'College not specified'}</div>
                    ${student.offersFreeMentoring ? `<span class="mentoring-badge">🎯 Mentoring</span>` : ''}
                </div>
            </div>

            ${teachSkills.length ? `
            <div class="mb-2">
                <div class="text-muted" style="font-size:0.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">Can Teach</div>
                <div>${teachSkills.map(s => skillTag(s, 'teach')).join('')}
                ${student.skillsCanTeach.length > 3 ? `<span class="skill-tag" style="background:#f3f4f6;color:#6b7280;">+${student.skillsCanTeach.length - 3}</span>` : ''}</div>
            </div>` : ''}

            ${learnSkills.length ? `
            <div class="mb-3">
                <div class="text-muted" style="font-size:0.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">Wants to Learn</div>
                <div>${learnSkills.map(s => skillTag(s, 'learn')).join('')}
                ${student.skillsWantToLearn.length > 3 ? `<span class="skill-tag" style="background:#f3f4f6;color:#6b7280;">+${student.skillsWantToLearn.length - 3}</span>` : ''}</div>
            </div>` : ''}

            <div class="mt-auto d-flex gap-2">
                <a href="/student.html?id=${student.id}" class="btn-secondary-ss flex-grow-1 justify-content-center" style="font-size:0.85rem;padding:0.4rem 0.75rem;">
                    <i class="fas fa-user"></i> View Profile
                </a>
                <button class="btn-primary-ss flex-grow-1 justify-content-center" style="font-size:0.85rem;padding:0.4rem 0.75rem;"
                        onclick="openRequestModal(${JSON.stringify(student).replace(/"/g, '&quot;')})">
                    <i class="fas fa-paper-plane"></i> Request
                </button>
            </div>
        </div>
    </div>`;
}

function renderPagination(totalPages, currentPage) {
    if (totalPages <= 1) {
        document.getElementById('paginationContainer').innerHTML = '';
        return;
    }
    let html = '<nav><ul class="pagination">';
    html += `<li class="page-item ${currentPage === 0 ? 'disabled' : ''}">
        <button class="page-link" onclick="searchStudents(${currentPage - 1})">‹ Prev</button></li>`;
    for (let i = 0; i < totalPages; i++) {
        html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
            <button class="page-link" onclick="searchStudents(${i})">${i + 1}</button></li>`;
    }
    html += `<li class="page-item ${currentPage === totalPages - 1 ? 'disabled' : ''}">
        <button class="page-link" onclick="searchStudents(${currentPage + 1})">Next ›</button></li>`;
    html += '</ul></nav>';
    document.getElementById('paginationContainer').innerHTML = html;
}

function clearFilters() {
    document.getElementById('skillSearch').value = '';
    document.getElementById('modeFilter').value = '';
    searchStudents();
}

// ---- REQUEST MODAL ----
function openRequestModal(student) {
    selectedReceiver = student;
    const initials = student.name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();

    document.getElementById('modalAvatar').textContent = initials;
    document.getElementById('modalName').textContent = student.name;
    document.getElementById('modalCollege').textContent = student.college || '';
    document.getElementById('requestError').classList.add('d-none');
    document.getElementById('requestMessage').value = '';

    // Populate receiver's CAN_TEACH skills in skillToLearn dropdown
    const learnSelect = document.getElementById('skillToLearn');
    learnSelect.innerHTML = '<option value="">-- Select skill to learn --</option>';
    (student.skillsCanTeach || []).forEach(s => {
        learnSelect.innerHTML += `<option value="${s.skillId}">${s.name}</option>`;
    });
    // If none, show all skills
    if (!student.skillsCanTeach || student.skillsCanTeach.length === 0) {
        allSkills.forEach(s => {
            learnSelect.innerHTML += `<option value="${s.id}">${s.name}</option>`;
        });
    }

    // Populate my CAN_TEACH skills in skillToTeach dropdown
    const teachSelect = document.getElementById('skillToTeach');
    teachSelect.innerHTML = '<option value="">-- Select skill to offer --</option>';
    // We need to load current user's skills
    api.get('/api/users/me').then(me => {
        (me.skillsCanTeach || []).forEach(s => {
            teachSelect.innerHTML += `<option value="${s.skillId}">${s.name}</option>`;
        });
    });

    document.getElementById('typeExchange').checked = true;
    toggleSkillTeach();

    new bootstrap.Modal(document.getElementById('requestModal')).show();
}

function toggleSkillTeach() {
    const isExchange = document.getElementById('typeExchange').checked;
    document.getElementById('skillToTeachGroup').style.display = isExchange ? '' : 'none';
}

async function sendRequest() {
    const errorDiv = document.getElementById('requestError');
    errorDiv.classList.add('d-none');

    const requestType = document.querySelector('input[name="requestType"]:checked').value;
    const skillToLearnId = document.getElementById('skillToLearn').value;
    const skillToTeachId = document.getElementById('skillToTeach').value;
    const message = document.getElementById('requestMessage').value.trim();

    if (!skillToLearnId) {
        errorDiv.textContent = 'Please select a skill you want to learn.';
        errorDiv.classList.remove('d-none');
        return;
    }
    if (requestType === 'EXCHANGE' && !skillToTeachId) {
        errorDiv.textContent = 'For skill exchange, please select a skill you can teach.';
        errorDiv.classList.remove('d-none');
        return;
    }

    const btn = document.getElementById('sendRequestBtn');
    setButtonLoading(btn, true);

    const payload = {
        receiverId: selectedReceiver.id,
        requestType,
        skillToLearnId: parseInt(skillToLearnId),
        skillToTeachId: requestType === 'EXCHANGE' ? parseInt(skillToTeachId) : null,
        message: message || null
    };

    try {
        await api.post('/api/requests', payload);
        showToast('Request sent successfully! 🎉', 'success');
        bootstrap.Modal.getInstance(document.getElementById('requestModal')).hide();
    } catch (err) {
        errorDiv.textContent = err.message || 'Could not send request. Please try again.';
        errorDiv.classList.remove('d-none');
    } finally {
        setButtonLoading(btn, false, 'Send Request');
    }
}

init();
</script>
</body>
</html>
