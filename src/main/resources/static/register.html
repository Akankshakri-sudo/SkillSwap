<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – SkillSwap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="brand"><i class="fa-solid fa-rotate me-2"></i>SkillSwap</div>
            <p class="text-muted mt-1">Create your free student account</p>
        </div>

        <form id="registerForm" novalidate>
            <!-- Name -->
            <div class="ss-form-group">
                <label for="name">Full Name <span class="text-danger">*</span></label>
                <input type="text" id="name" name="name" class="ss-input" placeholder="e.g. Priya Sharma" required>
                <div class="invalid-feedback" id="nameError"></div>
            </div>

            <!-- Email -->
            <div class="ss-form-group">
                <label for="email">College Email <span class="text-danger">*</span></label>
                <input type="email" id="email" name="email" class="ss-input" placeholder="yourname@college.edu" required>
                <div class="invalid-feedback" id="emailError"></div>
            </div>

            <!-- Password -->
            <div class="ss-form-group">
                <label for="password">Password <span class="text-danger">*</span></label>
                <div class="position-relative">
                    <input type="password" id="password" name="password" class="ss-input pe-5" placeholder="Min. 8 characters" required>
                    <button type="button" class="btn p-0 position-absolute top-50 translate-middle-y me-3 end-0 border-0 bg-transparent" onclick="togglePassword('password')">
                        <i class="fas fa-eye text-muted" id="passwordIcon"></i>
                    </button>
                </div>
                <div class="invalid-feedback" id="passwordError"></div>
            </div>

            <!-- College -->
            <div class="ss-form-group">
                <label for="college">College / University</label>
                <input type="text" id="college" name="college" class="ss-input" placeholder="e.g. IIT Bombay">
            </div>

            <div class="row">
                <!-- Department -->
                <div class="col-7">
                    <div class="ss-form-group">
                        <label for="department">Department</label>
                        <input type="text" id="department" name="department" class="ss-input" placeholder="e.g. Computer Science">
                    </div>
                </div>
                <!-- Year -->
                <div class="col-5">
                    <div class="ss-form-group">
                        <label for="yearOfStudy">Year</label>
                        <select id="yearOfStudy" name="yearOfStudy" class="ss-input">
                            <option value="">Select</option>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>
                            <option value="5">5th Year</option>
                            <option value="6">6th Year</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Error message -->
            <div id="registerError" class="alert alert-danger py-2 d-none" role="alert"></div>

            <!-- Submit -->
            <button type="submit" id="registerBtn" class="btn-primary-ss w-100 justify-content-center py-3">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>

        <p class="text-center text-muted mt-3 mb-0" style="font-size:0.9rem;">
            Already have an account? <a href="/login.html" class="fw-600">Sign in here</a>
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
    function togglePassword(fieldId) {
        const field = document.getElementById(fieldId);
        const icon = document.getElementById(fieldId + 'Icon');
        if (field.type === 'password') {
            field.type = 'text';
            icon.className = 'fas fa-eye-slash text-muted';
        } else {
            field.type = 'password';
            icon.className = 'fas fa-eye text-muted';
        }
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const btn = document.getElementById('registerBtn');
        const errorDiv = document.getElementById('registerError');

        // Clear previous errors
        errorDiv.classList.add('d-none');
        document.querySelectorAll('.ss-input').forEach(el => el.classList.remove('is-invalid'));

        // Frontend validation
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!name || name.length < 2) {
            showFieldError('name', 'Name must be at least 2 characters.');
            return;
        }
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            showFieldError('email', 'Please enter a valid email address.');
            return;
        }
        if (!password || password.length < 8) {
            showFieldError('password', 'Password must be at least 8 characters.');
            return;
        }

        setButtonLoading(btn, true);

        const payload = {
            name,
            email,
            password,
            college: document.getElementById('college').value.trim() || null,
            department: document.getElementById('department').value.trim() || null,
            yearOfStudy: document.getElementById('yearOfStudy').value
                ? parseInt(document.getElementById('yearOfStudy').value) : null
        };

        try {
            await api.post('/api/auth/register', payload);
            showToast('Account created! Logging you in...', 'success');
            // Auto login so student immediately goes to dashboard without delay
            try {
                await api.post('/api/auth/login', { email, password });
                window.location.href = '/dashboard.html';
            } catch (loginErr) {
                window.location.href = '/login.html';
            }
        } catch (err) {
            setButtonLoading(btn, false, 'Create Account');

            if (err.data?.errors) {
                // Show field-level validation errors from backend
                Object.entries(err.data.errors).forEach(([field, msg]) => {
                    showFieldError(field, msg);
                });
            } else {
                errorDiv.textContent = err.message || 'Registration failed. Please try again.';
                errorDiv.classList.remove('d-none');
            }
        }
    });

    function showFieldError(fieldId, message) {
        const field = document.getElementById(fieldId);
        if (field) {
            field.classList.add('is-invalid');
            const errEl = document.getElementById(fieldId + 'Error');
            if (errEl) {
                errEl.textContent = message;
                errEl.style.display = 'block';
            }
        }
    }
</script>
</body>
</html>
